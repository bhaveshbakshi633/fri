<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Friday</title>
<script src="https://unpkg.com/dexie@4.0.11/dist/dexie.min.js"></script>
<style>
:root{--bg:#0a0a1a;--card:#141428;--accent:#6366f1;--green:#10b981;--red:#ef4444;--text:#f0f0f0;--dim:#9ca3af;--muted:#4b5563;--border:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}

/* Nav */
nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer;transition:.2s}
.tab.on{color:var(--accent)}
.tab span:first-child{font-size:18px}

/* Content */
main{flex:1;overflow-y:auto;padding:20px 16px 90px;-webkit-overflow-scrolling:touch}
.pg{display:none}.pg.on{display:block}
h1{font-size:26px;font-weight:700;margin-bottom:16px}

/* Cards */
.c{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;transition:transform .15s}
.c:active{transform:scale(.98)}
.meta{font-size:12px;color:var(--dim);margin-top:8px;display:flex;gap:8px;align-items:center}

/* Input */
.bar{display:flex;gap:8px;margin-bottom:16px}
.bar input,.bar select{flex:1;padding:12px 14px;background:#1a1a30;border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;outline:none}
.bar input:focus{border-color:var(--accent)}
.bar button{padding:12px 18px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-weight:600;cursor:pointer}
.empty{text-align:center;padding:60px 20px;color:var(--dim)}

/* Tasks */
.trow{display:flex;align-items:center;gap:12px}
.tck{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--bg);flex-shrink:0;transition:.2s}
.tck.d{border-color:var(--green);background:var(--green)}
.dt{text-decoration:line-through;color:var(--dim)}
.del{background:none;border:none;cursor:pointer;font-size:13px;margin-left:auto;opacity:.5}

/* Settings */
.sg{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:16px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:14px}
.sr+.sr{border-top:1px solid var(--border)}
.sv{color:var(--dim);font-size:13px;max-width:55%;text-align:right;word-break:break-all}
.sl{font-size:12px;font-weight:600;color:var(--dim);padding:10px 16px 4px;text-transform:uppercase;letter-spacing:.5px}
.sr input{background:#1a1a30;border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;width:60%;text-align:right;outline:none}

/* Mic */
#mic{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:20px;width:58px;height:58px;border-radius:50%;background:var(--accent);border:none;color:#fff;cursor:pointer;z-index:60;box-shadow:0 4px 24px rgba(99,102,241,.4);font-size:22px;transition:.3s}
#mic.on{background:var(--green);box-shadow:0 4px 24px rgba(16,185,129,.5);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 24px rgba(16,185,129,.4)}50%{box-shadow:0 4px 40px rgba(16,185,129,.7)}}

/* Overlay */
#ov{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#ov.on{display:flex}
#ov .bg{position:absolute;inset:0;background:rgba(5,5,15,.94);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
#ov .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 24px;width:100%}
#ov-status{display:none}
#ov-orb{width:160px;height:160px;border-radius:50%;transition:background .5s,box-shadow .5s;animation:breathe 2.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
/* Yellow — waiting for wake word */
#ov.listening #ov-orb{background:radial-gradient(circle at 40% 40%,#fbbf24,#f59e0b,#d97706);box-shadow:0 0 60px rgba(251,191,36,.4)}
/* Green — wake word detected, listening for command */
#ov.active #ov-orb{background:radial-gradient(circle at 40% 40%,#34d399,#10b981,#059669);box-shadow:0 0 60px rgba(16,185,129,.5);animation:pulse-green .8s ease-in-out infinite}
@keyframes pulse-green{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
/* Purple — thinking */
#ov.thinking #ov-orb{background:radial-gradient(circle,#a78bfa,#7c3aed,#6d28d9);box-shadow:0 0 60px rgba(124,58,237,.5);animation:think .6s ease-in-out infinite}
@keyframes think{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
/* Red — speaking/outputting */
#ov.speaking #ov-orb{background:radial-gradient(circle at 40% 40%,#f87171,#ef4444,#dc2626);box-shadow:0 0 60px rgba(239,68,68,.5);animation:speak-pulse 1s ease-in-out infinite}
@keyframes speak-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#ov-hint{display:none}
#ov-stop{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:var(--dim);font-size:18px;cursor:pointer;margin-top:16px}

/* Conversation bubbles in overlay */
#ov-chat{max-height:30vh;overflow-y:auto;width:85%;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bubble{padding:10px 14px;border-radius:16px;font-size:14px;max-width:85%;animation:fadeIn .3s}
.bubble.user{background:var(--accent);align-self:flex-end;border-bottom-right-radius:4px}
.bubble.fri{background:var(--card);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;color:var(--dim)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
<nav>
<button class="tab on" onclick="showTab('notes')"><span>📝</span><span>Notes</span></button>
<button class="tab" onclick="showTab('tasks')"><span>✅</span><span>Tasks</span></button>
<button class="tab" onclick="showTab('reminders')"><span>🔔</span><span>Reminders</span></button>
<button class="tab" onclick="showTab('settings')"><span>⚙️</span><span>Settings</span></button>
</nav>
<main id="content">
<div id="p-notes" class="pg on"></div>
<div id="p-tasks" class="pg"></div>
<div id="p-reminders" class="pg"></div>
<div id="p-settings" class="pg"></div>
</main>
<button id="mic" onclick="toggleMic()">🎤</button>
<div id="ov">
<div class="bg"></div>
<div class="in">
<p id="ov-status">Listening...</p>
<div id="ov-orb"></div>
<div id="ov-chat"></div>
<p id="ov-hint">Say "Friday" to start</p>
<button id="ov-stop" onclick="stopVoice()">✕</button>
<div id="dlog" style="position:absolute;bottom:50px;left:8px;right:8px;max-height:28vh;overflow-y:auto;background:rgba(0,0,0,.9);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px;font-family:monospace;font-size:11px;line-height:1.5;text-align:left"></div>
</div>
</div>
</div>

<script>
// ─── Diagnostic Logger ───
function L(msg,color){
  var el=document.getElementById('dlog');if(!el)return;
  if(!C('ast_show_log')){el.style.display='none';return}else{el.style.display=''}
  var t=new Date().toLocaleTimeString();
  var d=document.createElement('div');
  d.style.color=color||'#888';
  d.textContent=t+' '+msg;
  el.appendChild(d);
  el.scrollTop=el.scrollHeight;
  // Max 30 lines
  while(el.children.length>30)el.removeChild(el.firstChild);
  console.log('[F]',msg);
}
// ─── Nuke old SW ───
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})});if(window.caches)caches.keys().then(function(k){k.forEach(function(x){caches.delete(x)})})}

// ─── DB ───
var db=new Dexie('friday');
db.version(1).stores({notes:'++id,createdAt',tasks:'++id,status,createdAt',reminders:'++id,remindAt,isSent'});

// ─── Config System ───
var CFG_DEFAULTS={
  // API
  groq_key:'',
  // STT
  stt_lang:'en-US',
  stt_wake_word:'friday',
  stt_interim:true,
  stt_wake_cmd_delay:800,     // ms between wake word and command session
  stt_restart_delay:1500,     // ms between idle sessions
  stt_convo_restart:500,      // ms restart in conversation mode
  stt_convo_timeout:10000,    // ms conversation mode duration
  stt_cmd_fallback_delay:1000,// ms if command not captured
  // LLM
  llm_model:'llama-3.3-70b-versatile',
  llm_temperature:0.7,
  llm_max_tokens:150,
  llm_tool_choice:'auto',
  llm_history_max:20,
  llm_personality:'sharp',    // sharp, casual, formal, funny
  // TTS
  tts_voice:'en-US-AriaNeural',
  tts_fallback_rate:1.0,
  tts_timeout_per_char:150,   // ms per character timeout
  tts_min_timeout:5000,       // ms minimum timeout
  // Assistant
  ast_haptic:true,            // vibrate on wake word
  ast_auto_stop_lock:true,    // stop mic on phone lock
  ast_show_log:true,          // show diagnostic log
};
function C(key){var v=localStorage.getItem('fri_'+key);if(v===null)return CFG_DEFAULTS[key];try{return JSON.parse(v)}catch(e){return v}}
function CS(key,val){localStorage.setItem('fri_'+key,typeof val==='string'?val:JSON.stringify(val))}
// Convenience
function getKey(){return C('groq_key')}
function setKey(k){CS('groq_key',k)}
function getVoice(){return C('tts_voice')}

// ─── Tabs ───
var curTab='notes';
function showTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach(function(b,i){b.className='tab'+((['notes','tasks','reminders','settings'][i]===t)?' on':'')});
  document.querySelectorAll('.pg').forEach(function(p){p.className='pg'});
  document.getElementById('p-'+t).className='pg on';
  render();
}

// ─── Render ───
async function render(){
  if(curTab==='notes')await renderNotes();
  if(curTab==='tasks')await renderTasks();
  if(curTab==='reminders')await renderReminders();
  if(curTab==='settings')renderSettings();
}
async function renderNotes(){
  var n=await db.notes.orderBy('createdAt').reverse().limit(50).toArray();
  var h='<h1>Notes</h1><div class="bar"><input id="ni" placeholder="Quick note..."><button onclick="addNote()">+</button></div>';
  if(!n.length)h+='<div class="empty">📝<br><b>No Notes Yet</b><br><small>Say "Friday, note down..." or type above</small></div>';
  n.forEach(function(x){h+='<div class="c"><div>'+esc(x.content)+'</div><div class="meta"><span>'+(x.source==='voice'?'🎤':'📝')+'</span><span>'+ago(x.createdAt)+'</span><button class="del" onclick="delNote('+x.id+')">🗑</button></div></div>'});
  document.getElementById('p-notes').innerHTML=h;
}
async function renderTasks(){
  var t=await db.tasks.where('status').anyOf('pending','in_progress').reverse().sortBy('createdAt');
  var d=await db.tasks.where('status').equals('done').reverse().sortBy('createdAt');
  var dots={low:'🟢',medium:'🟡',high:'🟠',urgent:'🔴'};
  var h='<h1>Tasks</h1><div class="bar"><input id="ti" placeholder="New task..."><select id="tp"><option value="medium">Med</option><option value="low">Low</option><option value="high">High</option><option value="urgent">🔴</option></select><button onclick="addTask()">+</button></div>';
  if(!t.length&&!d.length)h+='<div class="empty">✅<br><b>All Clear</b><br><small>Say "Friday, add task..." or type above</small></div>';
  t.forEach(function(x){h+='<div class="c"><div class="trow"><button class="tck" onclick="togTask('+x.id+')"></button><div><div>'+esc(x.title)+'</div><div class="meta">'+(dots[x.priority]||'')+'<span>'+x.priority+'</span></div></div><button class="del" onclick="delTask('+x.id+')">🗑</button></div></div>'});
  if(d.length){h+='<details style="margin-top:16px"><summary style="color:var(--dim);cursor:pointer;padding:8px 0">Done ('+d.length+')</summary>';d.slice(0,10).forEach(function(x){h+='<div class="c"><div class="trow"><button class="tck d" onclick="togTask('+x.id+')">✓</button><div class="dt">'+esc(x.title)+'</div><button class="del" onclick="delTask('+x.id+')">🗑</button></div></div>'});h+='</details>'}
  document.getElementById('p-tasks').innerHTML=h;
}
async function renderReminders(){
  var now=new Date(),r=await db.reminders.where('isSent').equals(0).sortBy('remindAt');
  var h='<h1>Reminders</h1><div class="bar"><input id="ri" placeholder="Remind me to..."><input id="rt" type="datetime-local" value="'+defTime()+'"><button onclick="addReminder()">+</button></div>';
  if(!r.length)h+='<div class="empty">🔔<br><b>No Reminders</b><br><small>Say "Friday, remind me..." or add above</small></div>';
  r.forEach(function(x){var ov=new Date(x.remindAt)<=now;h+='<div class="c"><div>'+esc(x.title)+'</div><div class="meta"><span style="color:'+(ov?'var(--red)':'var(--dim)')+'">🔔 '+relTime(x.remindAt)+'</span><button class="del" onclick="delReminder('+x.id+')">🗑</button></div></div>'});
  document.getElementById('p-reminders').innerHTML=h;
}
function renderSettings(){
  var h='<h1>Settings</h1>';
  function sec(title){h+='<p class="sl">'+title+'</p><div class="sg">'}
  function end(){h+='</div>'}
  function row(label,desc,input){h+='<div class="sr" style="flex-direction:column;align-items:stretch;gap:4px"><div style="display:flex;justify-content:space-between;align-items:center"><span>'+label+'</span>'+input+'</div><div style="font-size:11px;color:var(--muted)">'+desc+'</div></div>'}
  function sel(key,opts){var cur=C(key);var s='<select onchange="CS(\''+key+'\',this.value)" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 8px;color:var(--text);font-size:12px;max-width:55%">';opts.forEach(function(o){s+='<option value="'+o[0]+'"'+(cur==o[0]?' selected':'')+'>'+o[1]+'</option>'});return s+'</select>'}
  function num(key,min,max,step){var cur=C(key);return'<input type="number" value="'+cur+'" min="'+min+'" max="'+max+'" step="'+(step||1)+'" onchange="CS(\''+key+'\',Number(this.value))" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 8px;color:var(--text);font-size:12px;width:80px;text-align:right">'}
  function tog(key){var cur=C(key);return'<label style="position:relative;width:44px;height:24px;display:inline-block"><input type="checkbox" '+(cur?'checked':'')+' onchange="CS(\''+key+'\',this.checked)" style="opacity:0;width:0;height:0"><span style="position:absolute;inset:0;background:'+(cur?'var(--green)':'var(--muted)')+';border-radius:12px;cursor:pointer;transition:.3s"></span><span style="position:absolute;top:2px;left:'+(cur?'22':'2')+'px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.3s"></span></label>'}
  function inp(key,type,placeholder){var cur=C(key);return'<input type="'+(type||'text')+'" value="'+esc(String(cur))+'" placeholder="'+(placeholder||'')+'" onchange="CS(\''+key+'\',this.value)" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 8px;color:var(--text);font-size:12px;width:55%;text-align:right">'}

  // ─── API ───
  sec('API');
  row('Groq API Key','LLM inference ke liye. console.groq.com se free mein bana.',inp('groq_key','password','gsk_...'));
  end();

  // ─── STT (Speech-to-Text) ───
  sec('STT — Speech Recognition');
  row('Language','Recognition language. en-US best for "Friday" detection. en-IN for Hindi-English mix.',sel('stt_lang',[['en-US','English (US)'],['en-IN','English (India)'],['en-GB','English (UK)'],['hi-IN','Hindi']]));
  row('Wake Word','Trigger word to activate Friday. Case-insensitive. Say this before any command.',inp('stt_wake_word','text','friday'));
  row('Interim Results','Show partial transcription while speaking. Enables real-time feedback.',tog('stt_interim'));
  row('Wake → Command Delay','Milliseconds between wake word detection and command listening session. Safari needs 500ms+. Too low = session fails.',num('stt_wake_cmd_delay',200,3000,100));
  row('Idle Restart Delay','Milliseconds between recognition sessions when waiting for wake word. Lower = more responsive but more battery drain.',num('stt_restart_delay',500,5000,100));
  row('Conversation Restart','Milliseconds between sessions in conversation mode (after first response). Lower = faster follow-up.',num('stt_convo_restart',200,2000,100));
  row('Conversation Timeout','How long (ms) Friday keeps listening without wake word after a response. 10000 = 10 seconds of free talk.',num('stt_convo_timeout',3000,30000,1000));
  row('Command Fallback Delay','If command session fails to capture, wait this long before going back to wake word mode.',num('stt_cmd_fallback_delay',500,3000,100));
  end();

  // ─── LLM ───
  sec('LLM — Language Model');
  row('Model','Groq model for inference. 70B = smartest but slower. 8B = fastest but dumber.',sel('llm_model',[['llama-3.3-70b-versatile','Llama 3.3 70B (smartest)'],['llama-3.1-70b-versatile','Llama 3.1 70B'],['llama-3.1-8b-instant','Llama 3.1 8B (fastest)'],['llama3-70b-8192','Llama 3 70B'],['mixtral-8x7b-32768','Mixtral 8x7B'],['gemma2-9b-it','Gemma 2 9B']]));
  row('Temperature','Creativity. 0 = deterministic/exact. 1 = creative/varied. 0.7 = balanced.',num('llm_temperature',0,1,0.1));
  row('Max Tokens','Maximum response length. Voice responses should be short (100-200). Longer = slower.',num('llm_max_tokens',50,500,10));
  row('Tool Choice','When to use tools (notes/tasks/reminders). Auto = LLM decides. Required = always use. None = never.',sel('llm_tool_choice',[['auto','Auto (LLM decides)'],['required','Required (always)'],['none','None (conversation only)']]));
  row('History Length','Number of messages to keep in context. More = better memory but slower. 20 = ~10 exchanges.',num('llm_history_max',6,40,2));
  row('Personality','Response style. Affects system prompt behavior.',sel('llm_personality',[['sharp','Sharp & Witty'],['casual','Casual & Friendly'],['formal','Formal & Professional'],['funny','Humorous & Playful'],['minimal','Minimal (1 word answers)']]));
  end();

  // ─── TTS ───
  sec('TTS — Voice Output');
  row('Voice','Edge TTS neural voice. Premium Microsoft voices, free.',sel('tts_voice',[['en-US-AriaNeural','Aria (US Female — natural)'],['en-US-JennyNeural','Jenny (US Female — warm)'],['en-US-GuyNeural','Guy (US Male — deep)'],['en-US-DavisNeural','Davis (US Male — calm)'],['en-US-JaneNeural','Jane (US Female — bright)'],['en-US-TonyNeural','Tony (US Male — casual)'],['en-IN-NeerjaNeural','Neerja (Indian Female)'],['en-IN-PrabhatNeural','Prabhat (Indian Male)'],['en-GB-SoniaNeural','Sonia (British Female)'],['en-GB-RyanNeural','Ryan (British Male)'],['en-AU-NatashaNeural','Natasha (Australian Female)']]));
  row('Fallback TTS Rate','SpeechSynthesis speed if Edge TTS fails. 1.0 = normal. 1.2 = slightly fast.',num('tts_fallback_rate',0.5,2.0,0.1));
  row('Timeout per Character','Max wait (ms) per character of response for audio playback. Prevents infinite hang.',num('tts_timeout_per_char',50,300,10));
  row('Minimum Timeout','Floor timeout (ms) for very short responses.',num('tts_min_timeout',3000,15000,1000));
  end();

  // ─── Assistant ───
  sec('Assistant — Behavior');
  row('Haptic Feedback','Vibrate phone on wake word detection. Tactile confirmation.',tog('ast_haptic'));
  row('Auto-stop on Lock','Stop mic when phone is locked or tab is hidden. Saves battery.',tog('ast_auto_stop_lock'));
  row('Show Diagnostic Log','Show live event log in overlay. Useful for debugging.',tog('ast_show_log'));
  end();

  // ─── Info ───
  sec('Stack Info');
  h+='<div class="sr"><span>STT</span><span class="sv">Web Speech API (free, on-device)</span></div>';
  h+='<div class="sr"><span>LLM</span><span class="sv">Groq Cloud (free 1000 req/day)</span></div>';
  h+='<div class="sr"><span>TTS</span><span class="sv">Edge TTS via Vercel (free)</span></div>';
  h+='<div class="sr"><span>Tools</span><span class="sv">Groq function calling</span></div>';
  h+='<div class="sr"><span>Storage</span><span class="sv">IndexedDB (on-device)</span></div>';
  end();

  // ─── Commands ───
  sec('Voice Commands');
  h+='<div class="sr" style="flex-direction:column;align-items:flex-start;gap:6px;font-size:13px;color:var(--dim)">';
  h+='<div>📝 "Friday, note down meeting at 3pm"</div>';
  h+='<div>✅ "Friday, add task buy groceries high priority"</div>';
  h+='<div>🔔 "Friday, remind me in 2 hours to call mom"</div>';
  h+='<div>📋 "Friday, what do I have to do today?"</div>';
  h+='<div>🔍 "Friday, search notes about the project"</div>';
  h+='<div>💬 "Friday, I have a meeting at 3" (auto-note + reminder)</div>';
  h+='<div>🗣️ After response, speak without "Friday" for 10s</div>';
  h+='</div>';
  end();

  // ─── Reset ───
  h+='<div style="padding:16px"><button onclick="if(confirm(\'Reset all settings?\')){Object.keys(CFG_DEFAULTS).forEach(function(k){localStorage.removeItem(\'fri_\'+k)});renderSettings()}" style="width:100%;padding:12px;background:var(--red);color:#fff;border:none;border-radius:12px;font-weight:600;cursor:pointer">Reset All Settings</button></div>';

  document.getElementById('p-settings').innerHTML=h;
}

// ─── DB Actions ───
async function addNote(c,s){var t=c||document.getElementById('ni').value.trim();if(!t)return;await db.notes.add({content:t,source:s||'text',createdAt:new Date()});if(!c&&document.getElementById('ni'))document.getElementById('ni').value='';render();return t}
async function delNote(id){await db.notes.delete(id);render()}
async function addTask(ti,pr){var t=ti||document.getElementById('ti').value.trim();if(!t)return;var p=pr||(document.getElementById('tp')?document.getElementById('tp').value:'medium');await db.tasks.add({title:t,status:'pending',priority:p,createdAt:new Date()});if(!ti&&document.getElementById('ti'))document.getElementById('ti').value='';render();return t}
async function togTask(id){var t=await db.tasks.get(id);if(t)await db.tasks.update(id,{status:t.status==='done'?'pending':'done'});render()}
async function delTask(id){await db.tasks.delete(id);render()}
async function addReminder(ti,dt){var t=ti||document.getElementById('ri').value.trim();var d=dt||new Date(document.getElementById('rt').value);if(!t||isNaN(d.getTime()))return;await db.reminders.add({title:t,remindAt:d,isSent:0,createdAt:new Date()});if(!ti&&document.getElementById('ri'))document.getElementById('ri').value='';render();return t}
async function delReminder(id){await db.reminders.delete(id);render()}

// ─── Groq LLM + Tool Calling ───
var TOOLS=[
  {type:'function',function:{name:'create_note',description:'Save a note or piece of information',parameters:{type:'object',properties:{content:{type:'string',description:'The note content'}},required:['content']}}},
  {type:'function',function:{name:'create_task',description:'Add a task/todo item',parameters:{type:'object',properties:{title:{type:'string'},priority:{type:'string',enum:['low','medium','high','urgent'],default:'medium'}},required:['title']}}},
  {type:'function',function:{name:'set_reminder',description:'Set a timed reminder',parameters:{type:'object',properties:{title:{type:'string'},time:{type:'string',description:'Natural language time like "in 2 hours", "tomorrow 9am", "tonight"'}},required:['title','time']}}},
  {type:'function',function:{name:'list_tasks',description:'Show pending tasks',parameters:{type:'object',properties:{}}}},
  {type:'function',function:{name:'list_notes',description:'Show recent notes',parameters:{type:'object',properties:{limit:{type:'number',default:5}}}}},
  {type:'function',function:{name:'search_notes',description:'Search notes by keyword',parameters:{type:'object',properties:{query:{type:'string'}},required:['query']}}},
  {type:'function',function:{name:'complete_task',description:'Mark a task as done',parameters:{type:'object',properties:{query:{type:'string',description:'Task name or keyword to find it'}},required:['query']}}},
  {type:'function',function:{name:'list_reminders',description:'Show upcoming reminders',parameters:{type:'object',properties:{}}}}
];

var SYSTEM_MSG={role:'system',content:"You are Friday, Bhavesh's personal AI assistant. You are an intelligent being, not a command parser.\n\nYour personality: Sharp, witty, warm, concise. Talk like a smart friend. Light humor OK. Never robotic or formal.\n\nBhavesh: Robotics engineer, AI builder. Values efficiency, hates unnecessary steps.\n\nCRITICAL RULES for responses:\n- You are being spoken aloud via TTS. Keep responses to 1-2 SHORT sentences.\n- No markdown, no bullet points, no numbered lists, no emojis, no asterisks.\n- Never say 'I have created a note' or 'I have set a reminder'. Just do it silently and respond naturally.\n- Be proactive: 'meeting at 3' = save note AND set reminder 15min before. Don't ask, just do it.\n- 'buy groceries' = create task. 'call mom at 6' = set reminder. Infer intent, don't wait for explicit commands.\n- When listing things, speak them naturally: 'You have 3 tasks: fix the bug, buy groceries, and call the dentist.'\n- Multiple actions from one message is normal. 'Meeting at 3, also remind me to eat lunch' = note + 2 reminders.\n- If someone says something worth remembering but doesn't say 'note down', still save it as a note.\n- If asked 'what do I have today', call list_tasks AND list_reminders and combine the answer.\n- For search, be helpful: 'what did I say about the project' = search notes.\n- Always respond conversationally. You're Friday, not a robot."};

var chatHistory=[];

async function callGroq(userMsg){
  var key=getKey();
  if(!key)return{reply:"Groq API key set nahi hai. Settings mein ja aur key daal.",toolCalls:[]};

  chatHistory.push({role:'user',content:userMsg});
  var hmax=C('llm_history_max');if(chatHistory.length>hmax)chatHistory=chatHistory.slice(-(hmax-4));

  var messages=[SYSTEM_MSG].concat(chatHistory);
  var body={model:C('llm_model'),messages:messages,tools:TOOLS,tool_choice:C('llm_tool_choice'),temperature:C('llm_temperature'),max_tokens:C('llm_max_tokens')};

  try{
    var res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
    if(!res.ok){var e=await res.text();throw new Error('Groq '+res.status+': '+e)}
    var data=await res.json();
    var msg=data.choices[0].message;

    // Tool calls handle kar
    if(msg.tool_calls&&msg.tool_calls.length>0){
      chatHistory.push(msg);
      var toolResults=[];
      for(var i=0;i<msg.tool_calls.length;i++){
        var tc=msg.tool_calls[i];
        var args=JSON.parse(tc.function.arguments);
        var result=await executeTool(tc.function.name,args);
        toolResults.push({role:'tool',tool_call_id:tc.id,content:JSON.stringify(result)});
      }
      chatHistory=chatHistory.concat(toolResults);

      // Second call — tool results ke saath final response lo
      var messages2=[SYSTEM_MSG].concat(chatHistory);
      var body2={model:C('llm_model'),messages:messages2,temperature:C('llm_temperature'),max_tokens:C('llm_max_tokens')};
      var res2=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body2)});
      var data2=await res2.json();
      var reply=data2.choices[0].message.content;
      chatHistory.push({role:'assistant',content:reply});
      return{reply:reply,toolCalls:msg.tool_calls};
    }

    var reply=msg.content;
    chatHistory.push({role:'assistant',content:reply});
    return{reply:reply,toolCalls:[]};
  }catch(err){
    console.error('Groq error:',err);
    return{reply:"Error: "+err.message,toolCalls:[]};
  }
}

async function executeTool(name,args){
  switch(name){
    case'create_note':await addNote(args.content,'voice');render();return{ok:true,message:'Note saved'};
    case'create_task':await addTask(args.title,args.priority||'medium');render();return{ok:true,message:'Task added'};
    case'set_reminder':{
      var d=parseTime(args.time||'');
      if(!d)d=new Date(Date.now()+3600000);
      await addReminder(args.title,d);render();
      return{ok:true,message:'Reminder set for '+d.toLocaleString()};
    }
    case'list_tasks':{
      var t=await db.tasks.where('status').anyOf('pending','in_progress').toArray();
      return{tasks:t.map(function(x){return{title:x.title,priority:x.priority}})};
    }
    case'list_notes':{
      var n=await db.notes.orderBy('createdAt').reverse().limit(args.limit||5).toArray();
      return{notes:n.map(function(x){return{content:x.content.slice(0,100),created:x.createdAt}})};
    }
    case'search_notes':{
      var q=(args.query||'').toLowerCase();
      var n=await db.notes.filter(function(x){return x.content.toLowerCase().indexOf(q)>=0}).limit(10).toArray();
      return{results:n.map(function(x){return x.content.slice(0,100)})};
    }
    case'complete_task':{
      var q=(args.query||'').toLowerCase();
      var t=await db.tasks.where('status').anyOf('pending','in_progress').toArray();
      var m=t.find(function(x){return x.title.toLowerCase().indexOf(q)>=0});
      if(m){await db.tasks.update(m.id,{status:'done'});render();return{ok:true,completed:m.title}}
      return{ok:false,message:'Task not found'};
    }
    case'list_reminders':{
      var r=await db.reminders.where('isSent').equals(0).toArray();
      return{reminders:r.map(function(x){return{title:x.title,time:x.remindAt}})};
    }
    default:return{error:'Unknown tool'};
  }
}

// ─── Edge TTS via Vercel Proxy ───
var TTS_PROXY='https://edge-tts-proxy-gamma.vercel.app/api/tts';

async function edgeTTS(text){
  try{
    var voice=getVoice();
    var res=await fetch(TTS_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,voice:voice})});
    if(!res.ok)throw new Error('TTS proxy HTTP '+res.status);
    var blob=await res.blob();
    if(blob.size<100)throw new Error('empty audio');

    // Reuse pre-unlocked audio element (created on mic tap user gesture)
    var audio=window._fridayAudio||new Audio();
    audio.src=URL.createObjectURL(blob);
    await new Promise(function(resolve){
      audio.onended=function(){resolve()};
      audio.onerror=function(){console.error('audio play error');resolve()};
      audio.play().then(function(){
        // Playing — wait for end
      }).catch(function(e){
        console.error('play() blocked:',e);
        // Fallback
        fallbackTTS(text).then(resolve);
      });
      // Safety timeout
      setTimeout(resolve,Math.max(text.length*C('tts_timeout_per_char'),C('tts_min_timeout')));
    });
  }catch(e){
    console.error('Edge TTS fail:',e);
    await fallbackTTS(text);
  }
}

function fallbackTTS(text){
  return new Promise(function(resolve){
    if(!window.speechSynthesis){resolve();return}
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=C('stt_lang');u.rate=C('tts_fallback_rate');
    var voices=speechSynthesis.getVoices();
    var pick=voices.find(function(v){return v.name.indexOf('Samantha')>=0})
      ||voices.find(function(v){return v.lang==='en-US'&&v.localService})
      ||voices.find(function(v){return v.lang.indexOf('en')===0});
    if(pick)u.voice=pick;
    u.onend=resolve;u.onerror=resolve;
    speechSynthesis.speak(u);
    setTimeout(resolve,Math.max(text.length*100+2000,5000));
  });
}

// ─── Mic Level Monitor (visual feedback) ───
var _micCtx=null,_micStream=null,_micAnim=null;
function startMicMonitor(){
  stopMicMonitor();
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    _micStream=stream;
    _micCtx=new(window.AudioContext||window.webkitAudioContext)();
    var src=_micCtx.createMediaStreamSource(stream);
    var analyser=_micCtx.createAnalyser();
    analyser.fftSize=256;
    src.connect(analyser);
    var data=new Uint8Array(analyser.frequencyBinCount);
    function tick(){
      if(!_micCtx)return;
      analyser.getByteFrequencyData(data);
      // Average volume 0-255
      var sum=0;for(var i=0;i<data.length;i++)sum+=data[i];
      var vol=sum/data.length;
      var orb=document.getElementById('ov-orb');
      if(orb){
        // Orb border grows with volume — white ring
        var ring=Math.min(vol/50,1);
        orb.style.boxShadow='0 0 '+(20+ring*60)+'px '+(10+ring*30)+'px rgba(255,255,255,'+(ring*0.3).toFixed(2)+'), '+orb.style.boxShadow.split(',').slice(-1)[0];
        orb.style.transform='scale('+(1+ring*0.15).toFixed(3)+')';
      }
      _micAnim=requestAnimationFrame(tick);
    }
    tick();
  }).catch(function(e){console.error('Mic monitor fail:',e)});
}
function stopMicMonitor(){
  if(_micAnim)cancelAnimationFrame(_micAnim);_micAnim=null;
  if(_micCtx){try{_micCtx.close()}catch(e){}}_micCtx=null;
  if(_micStream){_micStream.getTracks().forEach(function(t){t.stop()})}_micStream=null;
  var orb=document.getElementById('ov-orb');
  if(orb){orb.style.transform='';orb.style.boxShadow=''}
}

// ─── Voice Engine (STT) ───
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var micOn=false,wakeDetected=false,pendingCmd='';
var conversationMode=false; // response ke baad 10s tak wake word skip
var convoTimer=null;
var ttsUnlocked=false;

function toggleMic(){
  if(micOn){stopVoice();return}
  if(!getKey()){alert('Pehle Settings mein Groq API key daal.');showTab('settings');return}

  // Pre-create audio element on user gesture — iOS won't block play() later
  if(!window._fridayAudio){
    window._fridayAudio=new Audio();
    window._fridayAudio.play().catch(function(){}); // unlock
  }
  micOn=true;wakeDetected=false;pendingCmd='';conversationMode=false;
  document.getElementById('mic').className='on';document.getElementById('mic').textContent='🟢';
  showOv('listening');
  L('MIC ON — starting','#0f0');
  startMicMonitor();
  listenOnce();
}
function stopVoice(){
  micOn=false;wakeDetected=false;conversationMode=false;
  if(convoTimer)clearTimeout(convoTimer);
  stopMicMonitor();
  document.getElementById('mic').className='';document.getElementById('mic').textContent='🎤';
  hideOv();
}
// Wake word detection — continuous=false, restart loop
function listenOnce(){
  if(!SR||!micOn){L('listenOnce skip: SR='+!!SR+' micOn='+micOn,'#f66');return}
  var rec=new SR();rec.continuous=false;rec.interimResults=C('stt_interim');rec.lang=C('stt_lang');
  var dispatched=false;
  L('STT session starting...','#ff0');
  rec.onstart=function(){L('STT active — speak now','#0f0')};
  rec.onresult=function(e){
    if(dispatched)return;
    var text='',fin=false;
    for(var i=0;i<e.results.length;i++){text+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true}
    var lower=text.toLowerCase().trim();
    L((fin?'FINAL':'interim')+': "'+lower+'"','#0ff');

    if(conversationMode){
      if(fin&&lower.length>1){dispatched=true;L('CONVO CMD: '+lower,'#f0f');processCmd(lower)}
      else{pendingCmd=lower}
      return;
    }

    if(lower.indexOf(C('stt_wake_word'))>=0){
      var cmd=lower.slice(lower.indexOf(C('stt_wake_word'))+C('stt_wake_word').length).trim();
      if(cmd.length>1&&fin){
        dispatched=true;L('WAKE+CMD: '+cmd,'#0f0');processCmd(cmd);
      }else{
        wakeDetected=true;showOv('active');
        if(C('ast_haptic')&&navigator.vibrate)navigator.vibrate(50);
        L('WAKE WORD — waiting for command','#0f0');
        try{rec.stop()}catch(ex){}
      }
    }
  };
  rec.onend=function(){
    L('STT ended dispatched='+dispatched+' wake='+wakeDetected+' convo='+conversationMode,'#888');
    if(dispatched||!micOn)return;
    if(wakeDetected){L('Starting command session (800ms)','#ff0');setTimeout(listenForCommand,C('stt_wake_cmd_delay'));return}
    if(conversationMode&&pendingCmd.length>0){dispatched=true;processCmd(pendingCmd);return}
    if(conversationMode){setTimeout(listenOnce,C('stt_convo_restart'));return}
    L('Restart wake listener (1.5s)','#888');
    setTimeout(listenOnce,C('stt_restart_delay'));
  };
  rec.onerror=function(e){L('STT error: '+e.error,'#f66')};
  try{rec.start()}catch(ex){L('STT start FAIL: '+ex.message,'#f00');if(micOn)setTimeout(listenOnce,C('stt_restart_delay'))}
}

// Command capture — wake word ke baad
function listenForCommand(){
  if(!SR||!micOn){L('cmdListen skip','#f66');wakeDetected=false;showOv('listening');return}
  L('CMD session starting...','#0f0');
  var rec=new SR();rec.continuous=false;rec.interimResults=C('stt_interim');rec.lang=C('stt_lang');
  var captured='';
  var dispatched=false;
  rec.onstart=function(){L('CMD active — speak command','#0f0')};
  rec.onresult=function(e){
    var text='',fin=false;
    for(var i=0;i<e.results.length;i++){text+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true}
    captured=text.toLowerCase().trim();
    L((fin?'CMD FINAL':'cmd interim')+': "'+captured+'"','#0ff');
    if(fin&&captured.length>1&&!dispatched){dispatched=true;L('DISPATCH CMD: '+captured,'#f0f');try{rec.stop()}catch(ex){};processCmd(captured)}
  };
  rec.onend=function(){
    L('CMD ended dispatched='+dispatched+' captured="'+captured+'"','#888');
    if(dispatched)return;
    if(!micOn){wakeDetected=false;return}
    if(captured.length>1){dispatched=true;processCmd(captured);return}
    L('No command — back to wake word','#ff0');
    wakeDetected=false;showOv('listening');
    setTimeout(listenOnce,C('stt_cmd_fallback_delay'));
  };
  rec.onerror=function(e){L('CMD error: '+e.error,'#f66')};
  try{rec.start()}catch(ex){L('CMD start FAIL: '+ex.message,'#f00');wakeDetected=false;showOv('listening');if(micOn)setTimeout(listenOnce,C('stt_restart_delay'))}
}

function startConversationMode(){
  conversationMode=true;
  wakeDetected=false;
  pendingCmd='';
  if(convoTimer)clearTimeout(convoTimer);
  // 10 sec — uske baad wapas wake word mode
  convoTimer=setTimeout(function(){
    conversationMode=false;
  },C('stt_convo_timeout'));
}

// ─── Command Pipeline ───
var _processing=false;
async function processCmd(text){
  if(_processing)return; // guard against double calls
  _processing=true;
  wakeDetected=false;pendingCmd='';conversationMode=false;
  if(convoTimer)clearTimeout(convoTimer);

  try{
    showOv('thinking');
    addBubble('user',text);
    L('Calling Groq...','#a78bfa');

    var result=await callGroq(text);
    var reply=result.reply||"Couldn't process that.";
    L('Groq reply: '+reply.slice(0,60),'#a78bfa');
    if(result.toolCalls&&result.toolCalls.length)L('Tools used: '+result.toolCalls.map(function(t){return t.function.name}).join(', '),'#f0f');

    addBubble('fri',reply);
    showOv('speaking');
    L('TTS starting...','#f66');

    try{await edgeTTS(reply);L('TTS done','#0f0')}catch(e){L('TTS FAIL: '+e.message,'#f00')}

    render();
  }catch(err){
    L('processCmd ERROR: '+err.message,'#f00');
    addBubble('fri','Error: '+err.message);
  }

  _processing=false;
  if(micOn){
    L('Resuming — conversation mode 10s','#ff0');
    startConversationMode();
    showOv('listening');
    setTimeout(listenOnce,C('stt_restart_delay'));
  }else{
    L('micOn=false, not resuming','#f66');
  }
}

// ─── Overlay ───
function showOv(state){
  document.getElementById('ov').className='on'+(state?' '+state:'');
}
function hideOv(){document.getElementById('ov').className='';document.getElementById('ov-chat').innerHTML=''}
function addBubble(who,text){
  var chat=document.getElementById('ov-chat');
  var d=document.createElement('div');d.className='bubble '+who;d.textContent=text;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}

// ─── Helpers ───
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function ago(d){var m=Math.floor((Date.now()-new Date(d).getTime())/60000);if(m<1)return'now';if(m<60)return m+'m';var h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d'}
function relTime(d){var diff=new Date(d).getTime()-Date.now(),m=Math.round(Math.abs(diff)/60000),p=diff<0;if(m<60)return p?m+'m ago':'in '+m+'m';var h=Math.round(m/60);if(h<24)return p?h+'h ago':'in '+h+'h';return p?Math.round(h/24)+'d ago':'in '+Math.round(h/24)+'d'}
function defTime(){return new Date(Date.now()+3600000).toISOString().slice(0,16)}
function parseTime(t){
  var l=t.toLowerCase();
  var m=l.match(/(?:in\s+)?(\d+)\s*(min|hour|hr|day|week)/);
  if(m){var ms={min:60000,hour:3600000,hr:3600000,day:86400000,week:604800000};return new Date(Date.now()+parseInt(m[1])*ms[m[2]])}
  if(/half\s*(an?\s*)?hour/.test(l))return new Date(Date.now()+1800000);
  if(/tomorrow/.test(l)){var d=new Date();d.setDate(d.getDate()+1);d.setHours(9,0,0,0);return d}
  if(/tonight|this evening/.test(l)){var d=new Date();d.setHours(20,0,0,0);return d}
  return null;
}
